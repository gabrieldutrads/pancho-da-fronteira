<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login administrativo do Pancho da Fronteira">
    <title>Login | Pancho da Fronteira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-login-page">
    <main class="login-shell">
        <div class="login-card">
            <div class="login-brand">
                <span class="admin-logo-icon">🌭</span>
                <div>
                    <h1>Pancho</h1>
                    <small>da Fronteira</small>
                </div>
            </div>

            <div class="login-copy">
                <span class="page-eyebrow">Área restrita</span>
                <h2>Entrar no painel</h2>
                <p>Gerencie produtos, categorias e pedidos em um só lugar.</p>
            </div>

            <form class="admin-form login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="admin@panchodafronteira.com" value="admin@panchodafronteira.com">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" value="123456">
                </div>

                <button type="submit" class="admin-button admin-button-primary login-button">Entrar</button>
            </form>

            <a href="../index.html" class="login-backlink">← Voltar para o site</a>
        </div>
    </main>

    <script src="../js/admin.js"></script>
</body>
</html>
